<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEW Admin | Updates Manager</title><link href="/css/gew-updates.css" rel="stylesheet"></head><body><main class="gew-admin-wrap"><section class="gew-admin-panel"><a href="/" style="color:#e6c15d">← Back to website</a><h1>GEW Updates Manager</h1><p style="color:#b8c5ce">Sign in to publish project progress, company news and festival greetings.</p><form id="login-form"><label>Admin email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="gew-admin-btn">Sign in</button></form><div id="editor" hidden><div class="gew-admin-row"><div><label>Post title</label><input id="title" maxlength="120"></div><div><label>Category</label><select id="category"><option>Project Update</option><option>Company News</option><option>Festival</option><option>Achievement</option></select></div></div><label>Description</label><textarea id="description" maxlength="1500"></textarea><label>Project location (optional)</label><input id="location" maxlength="120"><label>Upload photo (optional, max 8 MB)</label><input id="photo" type="file" accept="image/*"><div class="gew-admin-row"><button class="gew-admin-btn" id="publish" type="button">Publish Update</button><button class="gew-admin-btn secondary" id="logout" type="button">Sign out</button></div><div class="gew-admin-status" id="status"></div><div class="gew-admin-list"><h2>Recent posts</h2><div id="admin-posts">Loading…</div></div></div><div class="gew-admin-status" id="login-status"></div></section></main><script type="module" src="/js/gew-updates-admin.js"></script></body></html>
